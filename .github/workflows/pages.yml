name: Deploy Awesome Agentic Artifact Creation

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the canonical Awesome project
        uses: actions/checkout@v6
        with:
          repository: GeminiLight/awesome-agentic-artifact-creation
          ref: main
          path: source
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build site
        working-directory: source
        run: python3 scripts/build_site.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: source/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
